name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GITHUB_PAGES: 'true'
    steps:
      - name: Checkout explorer
        uses: actions/checkout@v4

      - name: Clone twilic monorepo (local @twilic/core sibling)
        run: git clone --depth 1 https://github.com/twilic/twilic.git "${{ github.workspace }}/../twilic"

      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 11.25.0
          cache: true
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.0

      - name: Install and build @twilic/core (WASM + TypeScript)
        working-directory: ${{ github.workspace }}/../twilic/runtimes/javascript
        run: |
          pnpm install --frozen-lockfile
          pnpm build:wasm
          pnpm build:ts

      - name: Install explorer dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Build explorer
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
